# Collaplex 虚拟声卡(纯转发) —— 全局音频 -> 虚拟声卡 -> HRTF 独立实例 -> 数字输出
# 占位符: __HRTF_IN__(接入 HRTF 的 sink 名), 由 脚本/安装.sh 渲染
context.modules = [
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Collaplex 虚拟声卡"
            capture.props = {
                media.class    = Audio/Sink
                node.name      = collaplex_vsink
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name      = collaplex_vsink_out
                audio.channels = 2
                audio.position = [ FL FR ]
                node.target    = "__HRTF_IN__"
            }
        }
    }
]
