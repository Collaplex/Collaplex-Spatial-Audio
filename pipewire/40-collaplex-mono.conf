# Collaplex 单声道混合(模拟 / 单声道设备) —— 本文件由 scripts/install.sh 生成
# (输出设备名在下面 playback.props 的 node.target 里, 由安装脚本填)
#
# 什么时候用: 输出端是只有一路的模拟设备(3.5 口接单声道蓝牙音响 / 老功放 / 单只喇叭)。
#   立体声直接送过去, 单声道设备只取一路 → 另一边的乐器/人声就没了;
#   所以先把双声道混成一路再出:
#
#     eq_out(FL,FR) ─┬─ ×0.5 ─┐
#                    └─ ×0.5 ─┴→ 单声道 ─┬→ FL
#                                       └→ FR   (两路都送同一路: 设备取哪一路都能响)
#
# 增益用 0.5 + 0.5: 两路都满幅时合成仍是 1.0, 相加不削波(等权平均)。
# 上游有响度归一化、下游 EQ 级有软限幅, 这里不再做额外补偿。
#
# 只在面板里给某台设备勾了「单声道混合」才部署本文件; 立体声设备不部署,
# 链路末段仍然是 30-collaplex-eq.conf 的 collaplex_eq_out。
context.modules = [
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Collaplex 单声道混合 (模拟/单声道设备)"
            media.name       = "Collaplex Mono Mix"
            filter.graph = {
                nodes = [
                    { type = builtin label = copy name = iL }
                    { type = builtin label = copy name = iR }
                    { type = builtin label = mixer name = sum control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }
                    { type = builtin label = copy name = oL }
                    { type = builtin label = copy name = oR }
                ]
                links = [
                    { output = "iL:Out"  input = "sum:In 1" }
                    { output = "iR:Out"  input = "sum:In 2" }
                    { output = "sum:Out" input = "oL:In" }
                    { output = "sum:Out" input = "oR:In" }
                ]
                inputs  = [ "iL:In" "iR:In" ]
                outputs = [ "oL:Out" "oR:Out" ]
            }
            capture.props = {
                media.class    = Audio/Sink
                node.name      = collaplex_mono_in
                node.description = "Collaplex 单声道混合接入"
                audio.channels = 2
                audio.position = [ FL FR ]
                # 同 10-/20-/30-: 链路里每一级都不能空闲休眠, 否则上游会停推
                node.always-process = true
                node.pause-on-idle  = false
            }
            playback.props = {
                node.name      = collaplex_mono_out
                audio.channels = 2
                audio.position = [ FL FR ]
                node.target    = "__TARGET__"
                node.always-process = true
                node.pause-on-idle  = false
            }
        }
    }
]
