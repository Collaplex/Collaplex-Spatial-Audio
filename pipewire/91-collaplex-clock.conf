# Collaplex 音效 — 96 kHz 主时钟(安装脚本会复制到 pipewire.conf.d/91-clock.conf)
#
# 为什么必须强制: PipeWire 的 convolver 会按"当前时钟率"重采样 IR。
# 时钟若是 48k, 96k/512tap 的 HRIR 会被降采样成等效 256tap —— 最高质量那句就白说了。
#
# 代价: 所有内容重采样到 96k。48k 内容(影片/多数音频)是整数比, 几乎无损;
#       44.1k 音乐略有精度损失。CPU 实测富余。
context.properties = {
    default.clock.rate          = 96000
    default.clock.allowed-rates = [ 96000 ]
}
